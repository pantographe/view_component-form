name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Lint with RuboCop
      run: bundle exec rubocop

  build:
    name: "Ruby ${{ matrix.versions.ruby }}, Rails ${{ matrix.versions.rails }}, ${{ matrix.action_text }} ActionText"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        versions:
          - { ruby: "3.3", rails: "8.1", rubygems: "default" }
          - { ruby: "3.4", rails: "8.1", rubygems: "default" }
          - { ruby: "4.0", rails: "8.1", rubygems: "default" }
          - { ruby: "3.3", rails: "head", rubygems: "latest" }
          - { ruby: "3.4", rails: "head", rubygems: "latest" }
          - { ruby: "4.0", rails: "head", rubygems: "latest" }
        action_text: ["with", "without"]

    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.versions.rails }}.gemfile
      VIEW_COMPONENT_FORM_USE_ACTIONTEXT: ${{ matrix.action_text == 'with' && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.versions.ruby }}
        rubygems: ${{ matrix.versions.rubygems }}
        bundler-cache: true

    - name: Test with RSpec
      run: |
        COVERAGE=true bundle exec rake spec

    - name: Upload coverage results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-ruby-${{ matrix.versions.ruby }}-rails-${{ matrix.versions.rails }}-actiontext-${{ matrix.action_text }}
        path: coverage
